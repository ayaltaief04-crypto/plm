<app-navbar 
  *ngIf="!(router.url === '/' || router.url.includes('auth') || router.url.includes('login') || router.url.includes('rapport'))"
  (toggleSidebar)="sidebar.toggleSidebar()">
</app-navbar>

<div class="app-shell"
  [class.auth-layout]="router.url === '/' || router.url.includes('auth') || router.url.includes('login')"
  [class.rapport-layout]="router.url.includes('rapport')">

  <app-sidebar
    #sidebar
    [style.display]="(router.url === '/' || router.url.includes('auth') || router.url.includes('login') || router.url.includes('rapport')) ? 'none' : ''">
  </app-sidebar>

  <main class="app-content">
    <router-outlet></router-outlet>
  </main>
</div>
